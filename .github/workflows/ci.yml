name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze_test:
    name: Analyze & Test (TypeScript & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings=0 || true

  build_web:
    name: Build Expo Web
    runs-on: ubuntu-latest
    needs: analyze_test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Expo Web
        run: npx expo export --platform web
